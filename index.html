<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<script>if(/Android|iPhone|iPod|iPad|Mobile/i.test(navigator.userAgent)||matchMedia('(hover:none) and (pointer:coarse)').matches)document.documentElement.classList.add('phone')</script>
<style>
:root{--bg:#faf5ee;--ink:#3a2a2e;--wine:#7a2e3f;--gold:#b08d57;--soft:#e9dccb;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Jost','Helvetica Neue',Arial,sans-serif;font-size:19px;font-weight:400;overflow-x:hidden}
h1,h2,.serif{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:500}
#gate{display:none;position:fixed;inset:0;z-index:200;place-items:center;text-align:center;padding:8vw;background:radial-gradient(ellipse at 50% 25%,#fffaf2,#eadfcd 80%)}
html.phone #gate{display:grid}
html.phone #intro,html.phone main,html.phone .mus{display:none!important}
html.phone body{overflow:hidden}
#gate .g{max-width:440px;animation:gin 1.6s ease both}
@keyframes gin{from{opacity:0;transform:translateY(18px)}}
#gate svg{width:92px;height:auto;margin-bottom:26px;opacity:.9}
#gate h1{font-size:clamp(44px,13vw,64px);line-height:1.05;font-style:italic;color:var(--wine)}
#gate .r{width:70px;height:1px;background:var(--gold);margin:26px auto}
#gate p{font-size:19px;line-height:1.8;font-weight:300}
#gate .ubox{display:flex;align-items:center;gap:12px;max-width:100%;border:1px solid var(--gold);background:#fffdf8;padding:6px 6px 6px 16px;box-shadow:0 10px 26px #3a2a2e1a}
#gurl{flex:1;min-width:0;font-size:15px;text-align:left;overflow-wrap:anywhere;color:var(--ink)}
#gcopy{flex:none;background:var(--wine);color:#fffaf2;border:0;padding:13px 18px;font:500 13px 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
#gate .dm{margin-top:30px;font-size:22px;font-weight:500;letter-spacing:.5em;text-indent:.5em;color:var(--gold)}
#gate .h{margin-top:26px;color:var(--wine);font-size:22px;letter-spacing:.3em}
main{min-height:100vh;display:grid;place-items:center;padding:6vw;background:radial-gradient(ellipse at 50% 25%,#fffaf2,#eadfcd 80%)}
.wrap{display:grid;justify-items:center;gap:clamp(34px,6vw,64px);text-align:center;animation:gin 1.8s ease both}
.count{display:flex;gap:clamp(12px,3vw,34px);justify-content:center}
.count div{min-width:clamp(104px,19vw,240px);padding:clamp(22px,3.6vw,46px) 14px clamp(18px,3vw,36px);border:1px solid var(--gold);background:#fffdf8aa;box-shadow:0 20px 50px #3a2a2e1a}
.count b{display:block;font:italic 500 clamp(60px,12vw,150px)/1 'Cormorant Garamond',Georgia,serif;color:var(--wine)}
.count span{display:block;margin-top:16px;font-size:clamp(12px,1.3vw,16px);letter-spacing:.35em;text-indent:.35em;text-transform:uppercase;color:var(--gold)}
.dmo{font-size:clamp(22px,2.6vw,32px);font-weight:500;letter-spacing:.5em;text-indent:.5em;color:var(--gold)}
</style></head>
<body>
<div id="gate"><div class="g">
<svg viewBox="0 0 120 80" fill="none" stroke="#b08d57" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="8" width="76" height="50" rx="4"/><path d="M8 66h104l-6 6H14z"/><path d="M60 46c-9-6-12-11-9-15 2-3 7-3 9 1 2-4 7-4 9-1 3 4 0 9-9 15z" stroke="#7a2e3f"/></svg>
<h1>Open it on your laptop</h1><div class="r"></div>
<div class="ubox"><span id="gurl"></span><button id="gcopy" type="button">Copy</button></div>
<p class="dm">DUMBO</p>
<div class="h">&#9829;</div></div></div>
<main><div class="wrap">
<div class="count"><div><b id="h">00</b><span>Hours</span></div><div><b id="m">00</b><span>Minutes</span></div><div><b id="s">00</b><span>Seconds</span></div></div>
<div class="dmo">DUMBO</div>
</div></main>
<script>
// counts down to 17 November 2026, 12:00 am (midnight) in the viewer's local time
var T=new Date(2026,10,17,0,0,0).getTime();
function pad(n){return n<10?'0'+n:''+n}
function tick(){var s=Math.max(0,Math.floor((T-Date.now())/1000));
 document.getElementById('h').textContent=pad(Math.floor(s/3600));
 document.getElementById('m').textContent=pad(Math.floor(s%3600/60));
 document.getElementById('s').textContent=pad(s%60)}
tick();setInterval(tick,250);
// phone screen: show the page address with a copy button
(function(){var u=(/^https?:/.test(location.protocol)?location.href.split('#')[0].split('?')[0]:'https://my-kitkat.github.io/17-11/'),t=document.getElementById('gurl'),b=document.getElementById('gcopy');
 t.textContent=u.replace(/^https?:\/\//,'');
 function ok(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},2000)}
 function fb(){var a=document.createElement('textarea');a.value=u;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()}
 b.onclick=function(){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(u).then(ok,fb);else fb()}})();
</script></body></html>
